<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Princess Bature</title>
    <link rel="stylesheet" href="sumayya.css">
</head>
<body>
    <header>
        <img src="profile.jpg" alt="Princess Bature profile picture">
        <h1>Hi, I'm Princess Bature</h1>
        <p>Frontend Developer & Creative Designer</p>
    </header>
    <nav>
        <a href="#about">About</a>
        <a href="#hobbies">Hobbies</a>
        <a href="#contact">Contact</a>
    </nav>
    <main>
        <section class="cards">
            <div class="card" id="about">
                <h2>About Me</h2>
                <p>I'm learning web development because I want to build beautiful websites and create things for the internet.</p>
            </div>
            <div class="card" id="hobbies">
                <h2>Things I Enjoy</h2>
                <span>Reading</span>
                <span>Design</span>
                <span>Coding</span>
            </div>
        </section>
        <section class="contact" id="contact">
            <h2>Get In Touch</h2>
            <form>
                <label>Name</label>
                <input type="text" placeholder="Your name">
                <label>Email</label>
                <input type="email" placeholder="you@example.com">
                <label>Message</label>
                <textarea placeholder="Say hello..."></textarea>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>
</body>
</html>
